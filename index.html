<style>
@font-face{font-family:"Fraunces";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/fraunces-latin-600-normal.woff2) format("woff2")}
:root{
  --ink:#1E1836;--muted:#6B6585;--bg:#F6F4FD;--surface:#fff;--line:#E7E2F6;
  --p:#6D3FE0;--p-d:#5429BE;--p-l:#EFE9FD;--p-xl:#F8F5FF;
  --known:#25A57B;--known-l:#E1F6EE;--learn:#E8932A;--learn-l:#FFF1DE;--danger:#D6455D;
  --beg:#25A57B;--int:#E8932A;--adv:#D9468F;--known-t:#177A5A;--learn-t:#8F560C;
  --btn:#6D3FE0;--btn-h:#5429BE;--hdr:rgba(246,244,253,.85);--navbg:rgba(255,255,255,.95);--track:#EEEAF8;--glow:#E6DCFF;--back1:#F8F5FF;--back2:#EBE2FF;--back-line:#D8CBF7;--sech:#E3D9FC;--ex:#3C3360;--toast:#1E1836;--toast-t:#fff;
  --r:18px;--shadow:0 1px 2px rgba(40,20,90,.06),0 8px 24px rgba(40,20,90,.07);
  --amber:#F2A93B;--serif:"Fraunces",Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme=dark]{--ink:#ECE8FA;--muted:#A49DC0;--bg:#14101F;--surface:#1D1830;--line:#2E2748;--p:#9B78F5;--p-d:#B49BFA;--p-l:#2A2147;--p-xl:#221B3B;--known:#37C597;--known-t:#5FDDB5;--learn-t:#F5B263;--known-l:#143B31;--learn:#F0A24A;--learn-l:#40290F;--danger:#F0647B;--btn:#7B52E8;--btn-h:#6A41D6;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--hdr:rgba(20,16,31,.85);--navbg:rgba(29,24,48,.95);--track:#2B2444;--glow:#2B1D58;--back1:#241C42;--back2:#2F2358;--back-line:#443775;--sech:#352A5C;--ex:#D9D0F5;--toast:#ECE8FA;--toast-t:#1E1836;color-scheme:dark}
html[data-theme=dark] .btn.ok{background:#1F8C69}html[data-theme=dark] .btn.ok:hover{background:#1A7A5B}
html[data-theme=dark] .btn.warn{color:#F5B263}html[data-theme=dark] .btn.warn:hover{background:#523414}
html[data-theme=dark] .btn.dng{background:#D6455D}
html[data-theme=dark] .tag.Beginner{color:#5FDDB5}html[data-theme=dark] .tag.Intermediate{color:#F5B263}html[data-theme=dark] .tag.Advanced{background:#3E1A2D;color:#F08BBB}
html.theme-anim *{transition:background-color .35s ease,color .35s ease,border-color .35s ease,box-shadow .35s ease!important}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(900px 400px at 85% -10%,var(--glow) 0,transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #A98BF5;outline-offset:2px}
.hide{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1160px;margin:auto;padding:12px clamp(16px,3vw,32px);display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.4rem;font-weight:700;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.logo{width:34px;height:34px;flex:none}
nav{display:flex;gap:4px;margin-left:auto}
nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;transition:.2s}
nav a:hover{color:var(--p);background:var(--p-l)}
nav a.on{background:var(--btn);color:#fff}
main{max-width:1160px;margin:auto;padding:28px clamp(16px,3vw,32px) 60px}
h1{font-family:var(--serif);font-size:clamp(1.9rem,4.5vw,2.7rem);letter-spacing:-.025em;line-height:1.15}
h2{font-family:var(--serif);font-size:1.35rem;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:6px;max-width:56ch}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:24px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:650;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--btn);color:#fff;box-shadow:0 6px 16px rgba(109,63,224,.3)}
.btn.pri:hover{background:var(--btn-h)}
.btn.sec{background:var(--p-l);color:var(--p-d)}.btn.sec:hover{background:var(--sech)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{background:var(--p-xl);border-color:#CFC3F3}
.btn.ok{background:var(--known);color:#fff}.btn.ok:hover{background:#1D8E6A}
.btn.warn{background:var(--learn-l);color:#8F560C}.btn.warn:hover{background:#FFE6C4}
.btn.dng{background:var(--danger);color:#fff}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.88rem;border-radius:10px}
.hero-l .sub{color:#EEE8FF}
.hero-l .btn{background:#fff;color:#5429BE;align-self:flex-start;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.hero-l .btn:hover{background:#F3EEFF}
.ring{display:flex;align-items:center;gap:22px}
.ring svg{width:124px;height:124px;flex:none;transform:rotate(-90deg)}
.ring .bg{stroke:var(--p-l)}.ring .fg{stroke:var(--p);transition:stroke-dashoffset .6s ease}
.pct{font-family:var(--serif);font-size:2.4rem;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px;margin-top:18px}
.stat b{display:block;font-family:var(--serif);font-size:2rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}
.stat i{display:block;width:30px;height:4px;border-radius:4px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:18px}
.lv{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.lvrow .t{display:flex;justify-content:space-between;font-size:.92rem;font-weight:600;margin-bottom:6px}
.lvrow .t em{font-style:normal;color:var(--muted);font-weight:500}
.track{height:9px;border-radius:9px;background:var(--track);overflow:hidden}
.track>i{display:block;height:100%;border-radius:9px;transition:width .5s ease}
.act{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:14px}
.act div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.act i{width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--p);min-height:4px}
.act i.z{background:var(--line)}
.act small{font-size:.75rem;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;transition:.2s}
.chip:hover{border-color:#CFC3F3}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.8rem;font-weight:650;background:var(--p-l);color:var(--p-d)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tag.Beginner{background:var(--known-l);color:#177A5A}
.tag.Intermediate{background:var(--learn-l);color:#8F560C}
.tag.Advanced{background:#FCE6F0;color:#B3306F}
.study{max-width:640px;margin:0 auto}
.meta{display:flex;justify-content:space-between;font-weight:650;font-size:.92rem;margin-bottom:8px}
.meta span{color:var(--muted);font-weight:500}
.scene{perspective:1400px;margin:22px 0;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.flip{position:relative;height:clamp(340px,64vw,440px);transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.flip.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:26px;display:flex;flex-direction:column;box-shadow:0 2px 4px rgba(40,20,90,.06),0 24px 48px rgba(77,34,174,.16);border:1px solid var(--line)}
.front{background:var(--surface);align-items:center;justify-content:space-between;text-align:center}
.front .top,.back .top{width:100%;display:flex;justify-content:space-between;align-items:center}
.pos{font-style:italic;font-family:var(--serif);color:var(--muted)}
.word{font-family:var(--serif);font-size:clamp(2.3rem,9vw,3.6rem);font-weight:700;letter-spacing:-.02em;word-break:break-word}
.hint{font-size:.85rem;color:var(--muted)}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--back1),var(--back2));justify-content:flex-start;gap:18px;overflow:auto}
.back .top{position:absolute;top:26px;left:26px;right:26px;width:auto}
.back h3{font-size:.8rem;color:var(--p-d);margin-bottom:4px}
.back p{font-size:1.1rem;line-height:1.55}
.back .def{padding-bottom:18px;border-bottom:1px solid var(--back-line)}
.back .ex p{font-family:var(--serif);font-style:italic;color:var(--ex);border-left:3px solid var(--p);padding-left:14px}
.back-in{margin:auto 0;padding-top:40px}
.selbar{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;min-height:34px;margin-bottom:6px;font-size:.9rem;color:var(--muted)}.selbar .linkbtn{padding:4px 2px;min-height:34px}.selbar .del{color:var(--danger)}
.chk{width:20px;height:20px;flex:none;accent-color:var(--p)}.item>.chk+div{flex:1}
.back-in>.def:last-child{border-bottom:0;padding-bottom:0}
.ctl{display:flex;justify-content:center;gap:10px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ans .btn{padding:16px}
.sbadge{font-size:.8rem;font-weight:650}
.empty{text-align:center;padding:50px 20px}
.empty p{color:var(--muted);margin:8px 0 18px}
.lvc .btn{margin-top:auto}
.mg{display:grid;grid-template-columns:380px 1fr;gap:18px;margin-top:22px;align-items:start}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--p);outline:0;box-shadow:0 0 0 4px var(--p-l)}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--danger);font-size:.82rem;margin-top:4px;min-height:0}
.bad{border-color:var(--danger)!important}
.fa{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tools input{flex:1;min-width:160px}.tools select{width:auto}
.list{display:flex;flex-direction:column;gap:10px;max-height:640px;overflow:auto;padding:2px}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.item:hover{border-color:#CFC3F3}
.item h4{font-family:var(--serif);font-size:1.15rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item p{color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .a{display:flex;gap:6px;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:#D9D3EC;flex:none}.dot.known{background:var(--known)}.dot.learning{background:var(--learn)}
.set{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set:last-child{border:0}.set p{color:var(--muted);font-size:.92rem;max-width:46ch}
dialog{margin:auto;max-height:calc(100dvh - 32px);overflow:auto;border:0;background:var(--surface);color:var(--ink);border-radius:22px;padding:28px;max-width:420px;width:calc(100% - 32px);box-shadow:0 30px 80px rgba(30,24,54,.35)}
dialog::backdrop{background:rgba(30,24,54,.5);backdrop-filter:blur(3px)}
dialog p{color:var(--muted);margin:8px 0 22px}
dialog .fa{justify-content:flex-end;margin:0}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--toast);color:var(--toast-t);padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw;font-weight:550;font-size:.92rem}
#toast.s{opacity:1;transform:translate(-50%,0)}
header.top{padding-top:env(safe-area-inset-top,0px)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:.2s;flex:none}
.iconbtn:hover{background:var(--p-l);color:var(--p)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tr{display:flex;align-items:center;gap:8px}
.heart{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.2s;flex:none}
.heart:hover{background:var(--p-l)}.heart.on{color:var(--adv)}
.heart svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.heart.on svg{fill:currentColor}
.search{margin:-6px 0 18px}
.goal{margin-top:18px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.pron{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap;color:var(--muted);min-height:44px}
#ipa{font-size:1.2rem;color:var(--ink);letter-spacing:.01em;font-family:"Segoe UI","Noto Sans","DejaVu Sans",system-ui,sans-serif}
#ipa .acc{font-size:.68rem;font-weight:700;color:var(--p-d);background:var(--p-l);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle;letter-spacing:.04em}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn.pbtn.playing,.btn.sbtn.playing{background:var(--btn);border-color:var(--btn);color:#fff;animation:pulse 1.2s ease-in-out infinite}
.iconbtn.pbtn.loading,.btn.sbtn.loading{opacity:.6;cursor:progress}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(109,63,224,.2)}}
.pbtn{width:44px;height:44px}
.pnote{width:100%;font-size:.8rem;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--p);text-decoration:underline;cursor:pointer;padding:8px 6px;min-height:36px}
.back .ar p{text-align:right;font-size:1.25rem;font-family:var(--sans)}
.dlgbtns{flex-wrap:wrap}
button,a,.chip{touch-action:manipulation}
.bar,main{padding-left:max(clamp(16px,3vw,32px),env(safe-area-inset-left));padding-right:max(clamp(16px,3vw,32px),env(safe-area-inset-right))}

@media(min-width:1100px){.study{max-width:700px}}
@media(max-width:1000px){.mg{grid-template-columns:1fr}nav a{padding:8px 11px}}

}

}
.pm{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:.2s}
.pm b{font-family:var(--serif);font-size:1.05rem}.pm span{color:var(--muted);font-size:.85rem}
.pm:hover{border-color:#CFC3F3}.pm.on{border-color:var(--p);background:var(--p-xl);box-shadow:0 0 0 3px var(--p-l)}
.prac{max-width:680px;margin:0 auto}

.pscore{font-family:var(--serif);font-size:3.2rem;font-weight:700;line-height:1.1}
.acclink{margin-left:4px}
html:not([data-theme=dark]) .back .hint,html:not([data-theme=dark]) .back .pos{color:#5B5478}
.today{max-width:520px;margin:12vh auto 0;text-align:center}.today .btn{margin-top:22px}
.pset{display:grid;gap:18px;max-width:640px;margin-top:20px}.pset .btn{justify-self:start}
#addbox>summary{cursor:pointer;font-family:var(--serif);font-size:1.15rem;font-weight:600;list-style:none}#addbox[open]>summary{margin-bottom:14px}

<body>
<header class="top"><div class="bar">
  <a class="brand" href="#dashboard" aria-label="Mnemo home"><svg class="logo" viewBox="0 0 128 128" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#4B22AE"/></linearGradient></defs><rect width="128" height="128" rx="30" fill="url(#lg)"/><g transform="translate(0 2)"><path d="M34 88V62a15 15 0 0 1 30 0v26M64 62a15 15 0 0 1 30 0v26" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="94" cy="38" r="8" fill="#F5B544"/></g></svg>Mnemo</a>
  <nav id="nav">
    <a href="#dashboard" data-v="dashboard">Dashboard</a>
    <a href="#study" data-v="study">Study</a>
    <a href="#practice" data-v="practice">Practice</a>
    <a href="#levels" data-v="levels">Levels</a>
    <a href="#words" data-v="words">Words</a>
    <a href="#settings" data-v="settings">Settings</a>
  </nav>
  <button class="iconbtn" id="theme" type="button" aria-label="Switch to dark mode" title="Switch theme"></button>
</div></header>
<main id="app"></main>
<dialog id="dlg"><h2 id="dT"></h2><p id="dM"></p><div class="fa dlgbtns"><button class="btn ghost" id="dNo">Cancel</button><button class="btn sec hide" id="dAlt"></button><button class="btn dng" id="dYes">Confirm</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const KEY = 'lumen.vocab.v1'; // legacy key kept so saved words and progress survive the rebrand
const LEVELS = ['Beginner', 'Intermediate', 'Advanced'];
const POS = ['noun', 'verb', 'adjective', 'adverb', 'preposition', 'conjunction', 'pronoun', 'interjection'];

const SEED = [
  ['curious','adjective','Beginner','Eager to learn or know something.','The curious child asked how the clock worked.'],
  ['borrow','verb','Beginner','To take something and give it back after using it.','Can I borrow your pen for a minute?'],
  ['journey','noun','Beginner','A trip from one place to another, especially a long one.','Their journey across the country took five days.'],
  ['gentle','adjective','Beginner','Calm, soft, and careful in the way you act or speak.','She spoke in a gentle voice to calm the puppy.'],
  ['improve','verb','Beginner','To become better, or to make something better.','Reading every day will improve your vocabulary.'],
  ['neighbor','noun','Beginner','A person who lives near you.','Our neighbor waters our plants when we travel.'],
  ['reliable','adjective','Intermediate','Able to be trusted to do what is expected.','He is a reliable colleague who always meets deadlines.'],
  ['negotiate','verb','Intermediate','To discuss something in order to reach an agreement.','They negotiated a fair price for the old house.'],
  ['perspective','noun','Intermediate','A particular way of thinking about something.','Travelling gave her a new perspective on her own culture.'],
  ['consequence','noun','Intermediate','A result or effect of an action or decision.','Missing the meeting had serious consequences for the project.'],
  ['reluctant','adjective','Intermediate','Unwilling and hesitant to do something.','She was reluctant to speak in front of the whole class.'],
  ['accomplish','verb','Intermediate','To succeed in doing or completing something.','He accomplished his goal of running a marathon.'],
  ['ephemeral','adjective','Advanced','Lasting for only a very short time.','The beauty of cherry blossoms is ephemeral, fading within days.'],
  ['meticulous','adjective','Advanced','Showing great attention to detail; very careful and precise.','The editor was meticulous, catching every tiny error.'],
  ['ubiquitous','adjective','Advanced','Seeming to be present everywhere at the same time.','Smartphones have become ubiquitous in modern life.'],
  ['mitigate','verb','Advanced','To make something less harmful, severe, or serious.','Planting trees can help mitigate the effects of urban heat.'],
  ['pragmatic','adjective','Advanced','Dealing with problems in a practical and realistic way.','She took a pragmatic approach and focused on what was achievable.'],
  ['serendipity','noun','Advanced','The pleasant discovery of something good by chance.','Meeting my mentor at the café was pure serendipity.']
];
// Extra details for the sample words: [Arabic meaning, Arabic translation of the example, synonyms, antonyms].
const SX = {
  curious: ['فضولي', 'سأل الطفل الفضولي كيف تعمل الساعة.', 'inquisitive, interested', 'uninterested'],
  borrow: ['يستعير', 'هل يمكنني استعارة قلمك لدقيقة؟', 'take on loan', 'lend'],
  journey: ['رحلة', 'استغرقت رحلتهم عبر البلاد خمسة أيام.', 'trip, voyage', ''],
  gentle: ['لطيف', 'تحدثت بصوت لطيف لتهدئة الجرو.', 'soft, kind', 'harsh, rough'],
  improve: ['يُحسّن', 'القراءة كل يوم ستحسّن مفرداتك.', 'enhance, better', 'worsen'],
  neighbor: ['جار', 'جارنا يسقي نباتاتنا عندما نسافر.', '', ''],
  reliable: ['موثوق', 'هو زميل موثوق يلتزم دائماً بالمواعيد النهائية.', 'dependable, trustworthy', 'unreliable'],
  negotiate: ['يتفاوض', 'تفاوضوا على سعر عادل للمنزل القديم.', 'bargain, haggle', ''],
  perspective: ['وجهة نظر', 'منحها السفر وجهة نظر جديدة عن ثقافتها.', 'viewpoint, outlook', ''],
  consequence: ['نتيجة', 'كان لتفويت الاجتماع عواقب خطيرة على المشروع.', 'result, outcome', 'cause'],
  reluctant: ['متردد', 'كانت مترددة في التحدث أمام الصف كله.', 'unwilling, hesitant', 'eager, willing'],
  accomplish: ['يُنجز', 'أنجز هدفه في الجري في ماراثون.', 'achieve, complete', 'fail'],
  ephemeral: ['زائل', 'جمال أزهار الكرز زائل ويتلاشى خلال أيام.', 'fleeting, short-lived', 'permanent, lasting'],
  meticulous: ['دقيق', 'كان المحرر دقيقاً وكشف كل خطأ صغير.', 'careful, thorough', 'careless'],
  ubiquitous: ['موجود في كل مكان', 'أصبحت الهواتف الذكية منتشرة في كل مكان في الحياة العصرية.', 'omnipresent, widespread', 'rare'],
  mitigate: ['يُخفّف', 'يمكن لزراعة الأشجار أن تخفف من آثار حرارة المدن.', 'reduce, lessen', 'worsen, aggravate'],
  pragmatic: ['عملي', 'اتبعت نهجاً عملياً وركزت على ما يمكن تحقيقه.', 'practical, realistic', 'idealistic'],
  serendipity: ['مصادفة سعيدة', 'كان لقائي بمرشدي في المقهى مصادفة سعيدة بحتة.', 'happy chance, good fortune', '']
};
// One-time cleanup of the old built-in samples (SEED/SX are kept only for this check and can be deleted later).
// A word is treated as a sample only if its id is s0..s17 (ids of words you add never look like that), its text still matches the original,
// and it holds no personal data: no study history, favorite, or edit. Anything else is kept.
const isSampleCopy = w => {
  const m = /^s(\d+)$/.exec(w.id || ''), r = m && SEED[+m[1]]; if (!r) return false;
  const x = SX[r[0]] || [], same = (a, b) => !a || a === b;
  return w.word === r[0] && w.pos === r[1] && w.level === r[2] && w.def === r[3] && w.ex === r[4]
    && !w.fav && !w.reviews && !w.due && !w.box && !w.lapses && (w.status || 'new') === 'new'
    && same(w.ar, x[0]) && same(w.arEx, x[1]) && same(w.syn, x[2]) && same(w.ant, x[3]);
};

const INT = [0, 1, 3, 7, 14, 30]; // days until next review after reaching box 0..5 (box 4+ = mastered)
function today(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(ds, n) { const [y, m, d] = ds.split('-').map(Number); return today(new Date(y, m - 1, d + n)); }
const needsMigration = w => !!w && typeof w === 'object' && w.due === undefined && (w.status === 'known' || w.status === 'learning');
// Old saves only had status. Known words start as mastered (due in a week); learning words are due today. Nothing is removed.
const migrate = w => !needsMigration(w) ? w : w.status === 'known' ? { ...w, box: 4, due: addDays(today(), 7) } : { ...w, box: 0, due: today() };
const state = w => !w.due ? 'new' : (w.box || 0) >= 4 ? 'known' : 'learning';
// Due = a studied word whose review date has come. New words are separate and released by the daily new-word limit.
const isDue = w => !!w.due && w.due <= today();
const NEW_PER_DAY = 10; // never-studied words released into the Due deck per day, so reviews are not flooded
const newToday = () => S.words.filter(w => w.first === today()).length;
const dueIds = () => S.words.filter(isDue).map(w => w.id).concat(S.words.filter(w => !w.due).slice(0, Math.max(0, NEW_PER_DAY - newToday())).map(w => w.id));
// Difficult / forgotten: missed at least once and not yet mastered again.
const isHard = w => (w.lapses || 0) > 0 && (w.box || 0) < 4;
let S = load();
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  const defs = { level: 'all', theme: 'light', accent: 'US', rate: .92 };
  try {
    const d = JSON.parse(raw);
    if (d && Array.isArray(d.words)) {
      if (d.words.some(needsMigration)) { try { if (!localStorage.getItem(KEY + '.premigration')) localStorage.setItem(KEY + '.premigration', raw); } catch (e) {} }
      return { v: 3, words: d.words.map(migrate).filter(w => d.v >= 3 || !isSampleCopy(w)), prefs: Object.assign(defs, d.prefs, d.prefs && d.prefs.level === 'hard' ? { level: 'all' } : {}), activity: d.activity || {}, goal: [5, 10, 20, 30].includes(d.goal) ? d.goal : 10, practice: Array.isArray(d.practice) ? d.practice : [], uniq: d.uniq && typeof d.uniq === 'object' && !Array.isArray(d.uniq) ? d.uniq : {}, rev: Number.isInteger(d.rev) ? d.rev : 0 };
    }
  } catch (e) {
    // Unreadable data is never overwritten silently: keep a copy of it before starting fresh.
    if (raw) { try { localStorage.setItem(KEY + '.corrupt', raw); } catch (e2) {} }
  }
  return { v: 3, words: [], prefs: defs, activity: {}, goal: 10, practice: [], uniq: {}, rev: 0 };
}
// Every save carries a revision number. If another tab saved in the meantime, this tab loads the newer data instead of overwriting it.
function save() {
  try {
    const cur = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (cur && Number.isInteger(cur.rev) && cur.rev !== (S.rev || 0)) { adopt(); toast('Another tab saved newer changes. The latest data was loaded. Please repeat your last action.'); return false; }
    const next = (S.rev || 0) + 1; localStorage.setItem(KEY, JSON.stringify({ ...S, rev: next })); S.rev = next; return true;
  } catch (e) { toast('Could not save. Your browser storage may be full or blocked.'); return false; }
}
function adopt() { S = load(); setTheme(S.prefs.theme === 'dark' ? 'dark' : 'light'); idx = 0; buildDeck(); render(); }

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const uid = () => 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('s'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('s'), 2600); }
function confirmDlg(title, msg, ok, alt) {
  return new Promise(res => {
    const d = $('#dlg'); $('#dT').textContent = title; $('#dM').textContent = msg; $('#dYes').textContent = ok;
    const a = $('#dAlt'); a.classList.toggle('hide', !alt); a.textContent = alt || ''; $('#dYes').className = 'btn ' + (alt ? 'pri' : 'dng');
    const done = v => { d.close(); $('#dYes').onclick = $('#dNo').onclick = a.onclick = null; res(v); };
    $('#dYes').onclick = () => done(true); $('#dNo').onclick = () => done(false); a.onclick = () => done('alt');
    d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal();
  });
}

function stats(list = S.words) {
  const total = list.length, known = list.filter(w => state(w) === 'known').length, fresh = list.filter(w => !w.due).length, t = today();
  return { total, known, fresh, learning: total - known - fresh, due: list.filter(w => w.due && w.due <= t).length, pct: total ? Math.round(known / total * 100) : 0 };
}
const byLevel = l => S.words.filter(w => w.level === l);

/* ---------- Study state ---------- */
let deck = [], idx = 0, flipped = false, sq = '';
// Study session tally for the progress bar and end-of-session summary.
let sess = { again: 0, hard: 0, good: 0, easy: 0 }, showSum = false;
const sessN = () => Object.values(sess).reduce((x, y) => x + y, 0);
// Records which words were answered each day. It is kept in the backup but not shown anywhere.
function countAct(id) {
  const k = today(); S.uniq = S.uniq || {}; const l = S.uniq[k] || (S.uniq[k] = []);
  S.activity[k] = (S.activity[k] || 0) + 1; if (id && !l.includes(id)) l.push(id);
  const ks = Object.keys(S.uniq).sort(); while (ks.length > 120) delete S.uniq[ks.shift()];
}
const heart = w => `<button class="heart ${w.fav ? 'on' : ''}" data-fav="${w.id}" aria-pressed="${!!w.fav}" aria-label="${w.fav ? 'Remove from favorites' : 'Add to favorites'}"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>`;
function buildDeck(keepOrder) {
  showSum = false;
  const lv = S.prefs.level, q = sq.trim().toLowerCase(), dq = new Set(dueIds());
  const pool = S.words.filter(w => (lv === 'all' || (lv === 'fav' ? w.fav : lv === 'due' ? dq.has(w.id) : lv === 'hard' ? isHard(w) : w.level === lv)) && (!q || w.word.toLowerCase().includes(q) || w.def.toLowerCase().includes(q) || (w.ar || '').includes(q) || (w.syn || '').toLowerCase().includes(q)));
  // Due deck: reviews before brand-new words, difficult (low box) first, oldest due first.
  if (lv === 'due') pool.sort((a, b) => (a.due ? 0 : 1) - (b.due ? 0 : 1) || (a.box || 0) - (b.box || 0) || String(a.due).localeCompare(String(b.due)));
  const ids = pool.map(w => w.id);
  if (keepOrder) { const kept = deck.filter(id => ids.includes(id)); deck = kept.concat(ids.filter(id => !kept.includes(id))); }
  else deck = ids;
  idx = Math.min(idx, Math.max(deck.length - 1, 0)); flipped = false;
}
function advance() {
  flipped = false;
  if (idx < deck.length - 1) idx++;
  else toast('You reached the end of this deck.');
}
// One place that updates a word after any answer (flashcards or practice), on the existing Leitner boxes (INT).
// again (or wrong): box 0, due today, one lapse per day. hard: same box, repeat after at least a day. good (or right): up one box. easy: up two.
// Boxes only move when the word is due, so repeating a card the same day cannot inflate progress.
function review(w, g) {
  g = g === true ? 'good' : g === false ? 'again' : g;
  const k = today(), first = !w.due, b = w.box || 0, late = !first && w.due < k; // overdue words are rescheduled from today; Easy only moves them up one box
  if (first && !w.first) w.first = k;
  if (g === 'again') { w.box = 0; w.due = k; if (w.lapseDay !== k) { w.lapses = (w.lapses || 0) + 1; w.lapseDay = k; } }
  else if (first || w.due <= k) {
    w.box = g === 'hard' ? b : Math.min(b + (g === 'easy' && !late ? 2 : 1), 5);
    w.due = addDays(k, Math.max(g === 'hard' ? 1 : 0, INT[w.box]));
  }
  w.status = g === 'again' || g === 'hard' ? 'learning' : 'known'; w.reviews = (w.reviews || 0) + 1; w.last = k;
}
function mark(grade) {
  const w = S.words.find(x => x.id === deck[idx]); if (!w || !flipped) return;
  review(w, grade); countAct(w.id); sess[grade]++; save();
  if (S.prefs.level === 'due') { deck.splice(idx, 1); if (grade === 'again') deck.push(w.id); idx = Math.min(idx, Math.max(deck.length - 1, 0)); flipped = false; }
  else advance();
  render();
}
function toggleFav(id) {
  const w = S.words.find(x => x.id === id); if (!w) return;
  w.fav = !w.fav; save();
  if (view() === 'words') wordList();
  else document.querySelectorAll('[data-fav]').forEach(b => { b.classList.toggle('on', w.fav); b.setAttribute('aria-pressed', w.fav); b.setAttribute('aria-label', w.fav ? 'Remove from favorites' : 'Add to favorites'); });
  toast(w.fav ? 'Added to favorites' : 'Removed from favorites');
}
function setTheme(t) {
  S.prefs.theme = t; document.documentElement.toggleAttribute('data-theme', false);
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  $('#themeColor').content = t === 'dark' ? '#14101F' : '#F6F4FD';
  const b = $('#theme'); b.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  b.innerHTML = t === 'dark' ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
}

/* ---------- Pronunciation ---------- */
// Word audio = human recordings hosted on Wikimedia Commons. We read them (and the IPA) from Wiktionary first, then from dictionaryapi.dev as a backup.
// Example sentences have no human recordings anywhere, so they use the device's computer voice and are always labeled that way.
const PKEY = 'mnemo.pron.v3'; let PR = {};
try { PR = JSON.parse(localStorage.getItem(PKEY)) || {}; localStorage.removeItem('mnemo.pron.v1'); localStorage.removeItem('mnemo.pron.v2'); } catch (e) {}
const speakerIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const probe = document.createElement('audio');
const canPlay = f => { const t = { ogg: 'audio/ogg; codecs=vorbis', oga: 'audio/ogg; codecs=vorbis', opus: 'audio/ogg; codecs=opus', mp3: 'audio/mpeg', wav: 'audio/wav', flac: 'audio/flac', m4a: 'audio/mp4' }[((f.match(/\.(\w+)$/) || [])[1] || '').toLowerCase()]; return !!t && probe.canPlayType(t) !== ''; };
const accOf = t => /\b(US|GA|General American|American|California)\b/i.test(t) ? 'US' : /\b(UK|RP|Received Pronunciation|Southern England|British|England)\b/i.test(t) ? 'UK' : '';
const slash = t => /^[\/\[]/.test(t) ? t : '/' + t + '/';
async function getJ(url, ms = 6000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal }); return { status: r.status, json: r.ok ? await r.json() : null }; } finally { clearTimeout(t); }
}
const FAIL = { ok: false, recs: [], ipas: [] }, NONE = { ok: true, recs: [], ipas: [] };
function parseWiki(text) {
  const m = text.match(/(?:^|\n)==\s*English\s*==([\s\S]*?)(?=\n==[^=]|$)/), recs = [], ipas = [];
  if (!m) return { recs, ipas };
  m[1].split('\n').forEach(line => {
    if (line[0] !== '*') return;
    const la = accOf((line.match(/\{\{(?:a|accent)\|[^}]*\}\}/i) || [''])[0]);
    for (const x of line.matchAll(/\{\{audio\|en\|([^|}]+)([^}]*)\}\}/gi)) recs.push({ file: x[1].trim(), acc: accOf(x[2]) || la });
    for (const x of line.matchAll(/\{\{IPA\|en\|([^}]*)\}\}/gi)) { const t = x[1].split('|').map(y => y.trim()).find(y => /^[\/\[]/.test(y)); if (t) ipas.push({ ipa: t, acc: accOf(x[1]) || la }); }
  });
  return { recs, ipas };
}
async function fetchWiki(k) {
  try {
    const r = await getJ('https://en.wiktionary.org/w/api.php?action=query&prop=revisions&rvprop=content&rvslots=main&redirects=1&format=json&formatversion=2&origin=*&titles=' + encodeURIComponent(k));
    if (!r.json) return FAIL;

const DAY = /^\d{4}-\d{2}-\d{2}$/;

  if (!/^[A-Za-z][A-Za-z' -]*$/.test(word) || !def || !POS.includes(pos) || !LEVELS.includes(r.level)) return null;
  const w = { id: uid(), word, pos, level: r.level, def, ex, status: ['known', 'learning'].includes(r.status) ? r.status : 'new' };
  if (r.fav === true) w.fav = true;
  const ar = str(r.ar, 100); if (ar) w.ar = ar;
  ['arEx', 'syn', 'ant'].forEach(k => { const t = str(r[k], 300); if (t) w[k] = t; });
  ['lapses', 'reviews'].forEach(k => { if (Number.isInteger(r[k]) && r[k] > 0 && r[k] < 1e6) w[k] = r[k]; });
  if (DAY.test(r.last || '')) w.last = r.last;
  if (Number.isInteger(r.added) && r.added >= 0) w.added = r.added;
  if (Number.isInteger(r.box) && r.box >= 0 && r.box <= 5 && DAY.test(r.due || '')) { w.box = r.box; w.due = r.due; }

function exportJSON() {
  S.prefs.lastExport = today(); save();
  const out = { app: 'Mnemo', version: 3, exported: new Date().toISOString(), words: S.words, activity: S.activity, goal: S.goal, practice: S.practice || [], uniq: S.uniq || {} };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mnemo-vocabulary-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Exported ' + S.words.length + ' words');
}
function importJSON(file, input) {
  if (!file) return;
  const fail = m => { input.value = ''; toast(m); };
  if (file.size > 5e6) return fail('Import failed: the file is too large.');
  const rd = new FileReader();
  rd.onerror = () => fail('The file could not be read.');
  rd.onload = async () => {
    let data; try { data = JSON.parse(rd.result); } catch (e) { return fail('Import failed: this is not valid JSON.'); }
    const arr = Array.isArray(data) ? data : data && Array.isArray(data.words) ? data.words : null;
    if (!arr) return fail('Import failed: expected a list of words.');
    const seen = new Set(), clean = []; let bad = 0;
    arr.forEach(r => { const w = cleanWord(r); if (!w) return bad++; const k = w.word.toLowerCase(); if (seen.has(k)) return; seen.add(k); clean.push(w); });
    if (!clean.length) return fail(`Import failed: no valid words found (${bad} invalid).`);
    const have = new Set(S.words.map(w => w.word.toLowerCase())), fresh = clean.filter(w => !have.has(w.word.toLowerCase()));
    const msg = `The file has ${clean.length} valid ${clean.length === 1 ? 'word' : 'words'}` + (bad ? ` and ${bad} invalid ${bad === 1 ? 'entry' : 'entries'} that will be ignored` : '') + `. Merge adds the ${fresh.length} new ${fresh.length === 1 ? 'word' : 'words'} and keeps everything you have. Replace swaps your whole collection and progress for the file and cannot be undone.`;
    const c = await confirmDlg('Import this backup?', msg, 'Merge', 'Replace');
    input.value = '';
    if (!c) return toast('Import cancelled. Nothing was changed.');
    if (c === 'alt') {
      S.words = clean;
      if (data.activity && typeof data.activity === 'object' && !Array.isArray(data.activity)) S.activity = Object.fromEntries(Object.entries(data.activity).filter(([k, v]) => DAY.test(k) && Number.isInteger(v) && v >= 0));
      if ([5, 10, 20, 30].includes(data.goal)) S.goal = data.goal;
      if (Array.isArray(data.practice)) S.practice = data.practice.filter(x => x && DAY.test(x.d || '') && Number.isInteger(x.s) && Number.isInteger(x.t)).slice(-60);
      S.uniq = data.uniq && typeof data.uniq === 'object' && !Array.isArray(data.uniq) ? Object.fromEntries(Object.entries(data.uniq).filter(([k, v]) => DAY.test(k) && Array.isArray(v)).map(([k, v]) => [k, v.filter(x => typeof x === 'string').slice(0, 500)])) : {};
    } else S.words = S.words.concat(fresh);
    idx = 0; save(); buildDeck(); render();
    toast(c === 'alt' ? `Replaced with ${clean.length} words` : `Merged ${fresh.length} new ${fresh.length === 1 ? 'word' : 'words'}`);
  };
  rd.readAsText(file);
}
setTheme(S.prefs.theme === 'dark' ? 'dark' : 'light');
$('#theme').addEventListener('click', () => {
  const root = document.documentElement; root.classList.add('theme-anim');
  setTheme(S.prefs.theme === 'dark' ? 'light' : 'dark'); save();
  setTimeout(() => root.classList.remove('theme-anim'), 450);
});
// Start a fresh daily count when the date changes while the app stays open.
let curDay = today();
const checkDay = () => { if (today() !== curDay) { curDay = today(); if (['dashboard', 'study'].includes(view())) render(); } };
setInterval(checkDay, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  S = load(); setTheme(S.prefs.theme === 'dark' ? 'dark' : 'light');
  if (view() === 'words') wordList(); else { buildDeck(true); render(); }
  toast('Your words were updated in another tab.');
});
window.addEventListener('offline', () => toast('You are offline. Your words and progress stay on this device.'));
window.addEventListener('online', () => toast('Back online'));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {} // ask the browser not to evict saved words
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast('Mnemo was updated. Reload to use the newest version.'); });
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).catch(() => {}));
}
buildDeck(); render();
})();
</script>
